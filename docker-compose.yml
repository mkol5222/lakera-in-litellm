services:
  litellm-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      retries: 5

  litellm:
    image: litellm/litellm:main-latest
    ports:
      - "4000:4000"
    depends_on:
      litellm-db:
        condition: service_healthy
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--detailed_debug"]
    environment:
      LITELLM_MASTER_KEY: "AdminIzK1ng"
      DATABASE_URL: "postgresql://litellm:litellm@litellm-db:5432/litellm"
      # Uncomment for GitHub Codespaces so the admin UI generates correct links.
      # The $CODESPACE_NAME env var from the host is substituted automatically:
      PROXY_BASE_URL: ${PROXY_BASE_URL}
      # For custom domains, set the full URL: https://proxy.example.com
      LAKERA_API_KEY: ${LAKERA_API_KEY}
      LAKERA_API_BASE: "https://api.lakera.ai"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      DOCS_URL: "/docs"              # Set docs to a different path
      ROOT_REDIRECT_URL: "/ui"       # Redirect root path (/) to /ui
      # OPENAI_API_KEY: "${OPENAI_API_KEY}"   # or whatever provider key you need